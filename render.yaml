services:
  - type: web
    name: graphfin-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: CORS_ORIGINS
        value: "https://hariharasuthan1105.github.io,http://localhost:5173"
