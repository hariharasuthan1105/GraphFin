# Render Blueprint for GraphFin Free Tier Single-Service Deployment
# Budget: ₹0 / $0 (Free plan). No paid services, no private services, no Starter instances.

previews:
  generation: "off"

services:
  # -------------------------------------------------------------------------
  # SINGLE FREE WEB SERVICE: Research Dashboard + Examiner Gateway + API
  # -------------------------------------------------------------------------
  - type: web
    name: graphfin-backend
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn gateway.single_service:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "10000"
      - key: GRAPHFIN_GATEWAY_ENV
        value: "production"
      - key: GRAPHFIN_DEPLOYMENT_MODE
        value: "single_service"
      - key: GRAPHFIN_SESSION_SECRET
        sync: false
      - key: EXAMINER_USERNAME
        sync: false
      - key: EXAMINER_PASSWORD_HASH
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
