name: Linux Security & Runtime Validation

on:
  push:
    branches: [ main, release/**, feature/** ]
  pull_request:
    branches: [ main, release/** ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner Security
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Build React Research Frontend
        run: |
          npm --prefix frontend run build -- --config vite.research.config.ts

      - name: Verify Startup and Read-Only Route Scope
        run: |
          python -m scripts.check_startup

      - name: Execute Backend Security & Host Access Suite (63 tests)
        run: |
          python -m pytest tests/test_private_access.py -v

      - name: Execute Web Gateway Security & Integration Suite (16 tests)
        run: |
          python -m pytest tests/test_gateway_security.py tests/test_gateway_e2e_integration.py -v

      - name: Execute Single-Service Free Architecture Suite (6 tests)
        run: |
          python -m pytest tests/test_single_service.py -v

      - name: Execute Internal HTTP Smoke Verification
        run: |
          python -m scripts.private_http_smoke
