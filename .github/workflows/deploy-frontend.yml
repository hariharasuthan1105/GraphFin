name: Deploy GraphFin Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy GraphFin Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://graphfin.onrender.com' }}
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "=== dist directory ==="
          ls -la dist
          echo "=== index.html ==="
          cat dist/index.html
          echo "=== Checking for PaySim in JS bundle ==="
          if grep -r "paysim\|PaySim" dist/assets/*.js > /dev/null 2>&1; then
            echo "✅ PaySim strings found in JS bundle"
          else
            echo "❌ WARNING: PaySim strings NOT found in JS bundle"
          fi
          echo "=== Checking API URL in JS bundle ==="
          if grep -r "graphfin.onrender.com" dist/assets/*.js > /dev/null 2>&1; then
            echo "✅ Correct API URL (graphfin.onrender.com) found in JS bundle"
          else
            echo "❌ WARNING: API URL not found in JS bundle"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          cname: ""