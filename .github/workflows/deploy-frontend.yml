name: Deploy GraphFin Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GraphFin Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Debug VITE_API_URL
        run: echo "VITE_API_URL is set to: ${{ vars.VITE_API_URL }}"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
        run: npm run build

      - name: Verify build output
        working-directory: frontend
        run: |
          echo "======================================"
          echo "GraphFin frontend build verification"
          echo "======================================"

          echo ""
          echo "=== dist directory ==="
          ls -la dist

          echo ""
          echo "=== dist/assets directory ==="
          ls -la dist/assets

          echo ""
          echo "=== index.html ==="
          cat dist/index.html

          echo ""
          echo "=== JavaScript assets ==="
          find dist/assets -maxdepth 1 -type f -name "*.js" -print

          echo ""
          echo "=== CSS assets ==="
          find dist/assets -maxdepth 1 -type f -name "*.css" -print

          echo ""
          echo "=== Required file checks ==="

          test -f dist/index.html
          test -d dist/assets

          JS_FILE=$(find dist/assets -maxdepth 1 -type f -name "*.js" | head -n 1)
          CSS_FILE=$(find dist/assets -maxdepth 1 -type f -name "*.css" | head -n 1)

          test -n "$JS_FILE"
          test -n "$CSS_FILE"

          echo ""
          echo "JavaScript asset:"
          echo "$JS_FILE"

          echo ""
          echo "CSS asset:"
          echo "$CSS_FILE"

          echo ""
          echo "======================================"
          echo "✅ GraphFin build output verified"
          echo "======================================"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy GraphFin to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4